name: TsuriDoki
options:
  bundleIdPrefix: com.snarfnet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH
    INFOPLIST_FILE: TsuriDoki/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TsuriDoki:
    type: application
    platform: iOS
    sources:
      - TsuriDoki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snarfnet.tsuridoki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
